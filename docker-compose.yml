version: '3.8'

# ─── Common Reusable API Configuration ─────────────────────────────────────────
x-api-common: &api-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    NODE_ENV: production
    PORT: 5000
    DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/multi_tenant_backend?schema=public}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    JWT_SECRET: ${JWT_SECRET}
    JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
    JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
    CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    SMTP_HOST: ${SMTP_HOST:-smtp.ethereal.email}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASS: ${SMTP_PASS:-}
    EMAIL_FROM: ${EMAIL_FROM:-Multi Tenant Backend <noreply@multitenantbackend.com>}
    LOG_LEVEL: ${LOG_LEVEL:-info}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:5000/health']
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 15s
  networks:
    - expense_network

services:
  # ─── Nginx Reverse Proxy & Load Balancer (Public Gateway) ───────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: multi_tenant_backend_nginx
    restart: unless-stopped
    ports:
      - '${GATEWAY_PORT:-80}:80'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api_1:
        condition: service_healthy
      api_2:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - expense_network

  # ─── API Instance 1 ────────────────────────────────────────────────────────
  api_1:
    <<: *api-common
    container_name: multi_tenant_backend_api_1
    command: ['node', 'dist/server.js']

  # ─── API Instance 2 ────────────────────────────────────────────────────────
  api_2:
    <<: *api-common
    container_name: multi_tenant_backend_api_2
    command: ['node', 'dist/server.js']

  # ─── BullMQ Background Workers (Standalone Process) ────────────────────────
  workers:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multi_tenant_backend_workers
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RUN_WORKERS: 'true'
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/multi_tenant_backend?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      SMTP_HOST: ${SMTP_HOST:-smtp.ethereal.email}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-Multi Tenant Backend <noreply@multitenantbackend.com>}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ['node', 'dist/jobs/workers/index.js', '--run-workers']
    networks:
      - expense_network

  # ─── PostgreSQL Database with pgvector (Internal) ──────────────────────────
  postgres:
    image: pgvector/pgvector:pg16-alpine
    container_name: multi_tenant_backend_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-multi_tenant_backend}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-multi_tenant_backend}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - expense_network

  # ─── Redis Cache & Broker (Internal) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: multi_tenant_backend_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - expense_network

networks:
  expense_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
