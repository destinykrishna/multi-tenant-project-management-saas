# ==============================================================================
# Nginx Reverse Proxy & Load Balancer Configuration
# ==============================================================================

events {
    # Maximum simultaneous connections per worker process
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    # Security hardening
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging format with client IP and upstream response tracking
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream_addr=$upstream_addr upstream_status=$upstream_status '
                    'upstream_response_time=$upstream_response_time request_time=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Gzip compression for API responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ─── Upstream API Cluster (Load Balancing) ────────────────────────────────
    upstream api_cluster {
        # Load balancing strategy: least_conn directs traffic to the server with fewest active connections
        least_conn;

        # Primary backend instances running on port 5000 inside the internal docker network
        server api_1:5000 max_fails=3 fail_timeout=10s;
        server api_2:5000 max_fails=3 fail_timeout=10s;

        # Keepalive connections to reduce latency and TCP handshake overhead
        keepalive 32;
    }

    # ─── HTTP Gateway Server (Public Entrypoint) ──────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # Request payload size limit matching Express JSON body limit
        client_max_body_size 10M;

        # ─── Health Check Endpoint ────────────────────────────────────────────
        # Proxies health check requests to the upstream cluster
        location /health {
            proxy_pass http://api_cluster/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        # ─── Application API Routes ───────────────────────────────────────────
        # Proxies all API requests to the load-balanced backend instances
        location / {
            proxy_pass http://api_cluster;
            proxy_http_version 1.1;

            # Clear hop-by-hop Connection header for HTTP/1.1 keepalive support
            proxy_set_header Connection "";

            # Standard proxy headers preserving client origin details for rate-limiting and logging
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Upstream timeout configurations
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Next upstream failover conditions
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}
